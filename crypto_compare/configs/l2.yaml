# Сравнение L2 на Ethereum. Base не имеет токена — в балл попадёт только по сетевым метрикам.
title: Сравнение L2-экосистем
output: output/l2_comparison.xlsx
template: templates/crypto_ecosystems_comparison.xlsx

weights:
  tvl_growth: 15
  addr_growth: 15
  mcap_tvl: 10
  mcap_rev: 15
  devs: 15
  unlock_6m: 10
  fdv_mcap: 10
  investors: 10

sources:
  lookback_days: 182
  unlock_horizon_days: 182
  revenue_type: dailyFees
  opendevdata:
    metric: exclusive_devs    # exclusive_devs | all_devs | full_time_devs (см. README)
  artemis:
    dau_avg_days: 7
    dev_metric: null          # платная метрика разработчиков Artemis; обычно не нужна

ecosystems:
  - name: Arbitrum
    category: L2
    coingecko_id: arbitrum
    defillama_chain: Arbitrum
    defillama_fees: arbitrum
    artemis_id: arbitrum
    opendevdata: Arbitrum
    tokenomist_id: arbitrum
  - name: Optimism
    category: L2
    coingecko_id: optimism
    defillama_chain: OP Mainnet
    defillama_fees: op-mainnet
    artemis_id: optimism
    opendevdata: Optimism
    tokenomist_id: optimism
  - name: Base
    category: L2
    defillama_chain: Base
    defillama_fees: base
    artemis_id: base
    opendevdata: Base
  - name: Mantle
    category: L2
    coingecko_id: mantle
    defillama_chain: Mantle
    defillama_fees: mantle
    artemis_id: mantle
    opendevdata: Mantle
    tokenomist_id: mantle
  - name: Starknet
    category: L2
    coingecko_id: starknet
    defillama_chain: Starknet
    defillama_fees: starknet
    artemis_id: starknet
    opendevdata: Starknet
